<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>手機掃碼計點系統</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script><script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
body{margin:0;background:#f4f6f5;color:#202824;font:16px system-ui,'Noto Sans TC',sans-serif}header{background:#214f43;color:white;padding:18px}main{max-width:760px;margin:auto;padding:14px;display:grid;gap:14px}.card{background:white;border-radius:15px;padding:16px;box-shadow:0 2px 10px #0001}h1{font-size:22px;margin:0 0 5px}h2{font-size:17px;margin:0 0 12px}.hint,.status{font-size:13px;color:#5c6862;line-height:1.6}input,button{font:inherit;border-radius:10px;padding:11px;border:1px solid #d3dcd6}input{width:100%;box-sizing:border-box}button{background:#214f43;color:white;border:0;font-weight:650}button.secondary{background:#edf3ef;color:#214f43;border:1px solid #d3dcd6}.row{display:flex;gap:8px;align-items:center;margin-top:10px}.row>*{min-width:0}.pill{font-size:12px;background:#edf5f0;color:#214f43;border-radius:30px;padding:5px 9px}.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}.metric{background:#f0f5f2;border-radius:10px;padding:12px;font-size:12px;color:#58645e}.metric b{display:block;font-size:23px;color:#214f43;margin-top:4px}.tablewrap{overflow:auto}table{border-collapse:collapse;width:100%;font-size:14px}td,th{padding:9px 5px;border-bottom:1px solid #e7ece9;text-align:left}th{font-size:12px;color:#65716a}td.num,th.num{text-align:right;white-space:nowrap}.empty{text-align:center;color:#777;padding:25px 4px}.qty{display:flex;gap:5px;justify-content:flex-end;align-items:center}.qty button{padding:4px 9px}.danger{background:#a52d2d}.total{font-size:26px;font-weight:800;color:#214f43}.foot{text-align:center;font-size:12px;color:#68736d;padding:0 14px 20px}@media(min-width:650px){main{grid-template-columns:1fr 1fr}.wide{grid-column:1/-1}}
</style></head><body><header><h1>手機掃碼計點系統</h1><div>匯入 Excel・掃描國際條碼・自動累計換購點數</div></header><main>
<section class="card"><h2>1. 匯入 Excel 商品表</h2><input id="file" type="file" accept=".xlsx,.xls,.csv"><p class="hint">固定讀取第一個工作表：D 欄＝國際條碼、F 欄＝品名、O 欄＝換購點數；第一列標題列會略過。</p><div class="row"><button class="secondary" id="template">下載欄位範例 CSV</button><span class="pill" id="count">商品 0 筆</span></div><p class="status" id="imp">尚未匯入商品資料。</p></section>
<section class="card"><h2>2. 手機掃描商品</h2><div id="reader"></div><div class="row"><button id="start">開啟相機掃描</button><button class="secondary" id="stop" disabled>停止掃描</button></div><p class="status" id="scanStatus">請使用 HTTPS 網址並允許相機權限。</p><label class="hint">手動輸入條碼</label><div class="row"><input id="manual" placeholder="輸入或貼上國際條碼" inputmode="numeric"><button id="add">計點</button></div></section>
<section class="card wide"><div class="row" style="justify-content:space-between;margin:0"><h2>3. 本次計點清單</h2><button class="secondary" id="clear">清空清單</button></div><div class="stats"><div class="metric">商品種類<b id="kinds">0 種</b></div><div class="metric">商品總數<b id="qty">0 件</b></div><div class="metric">累計換購點數<b id="points">0 點</b></div><div class="metric">每次掃描<b>數量 +1</b></div></div><div class="tablewrap"><table><thead><tr><th>品名／國際條碼</th><th class="num">每件點數</th><th class="num">數量</th><th class="num">小計</th><th></th></tr></thead><tbody id="rows"><tr><td colspan="5" class="empty">尚未掃描商品</td></tr></tbody></table></div><div class="row"><button id="export" style="width:100%">匯出計點明細 CSV</button></div><p class="hint">點數小計＝O 欄換購點數 × 商品數量。此工具只做計點與明細匯出，不會直接寫入會員帳戶。</p></section></main><div class="foot">單機原型：重新整理可能清空本次清單，請先匯出明細。</div>
<script>
const products=new Map(),cart=new Map();let scanner=null,scanning=false,lastCode='',lastAt=0;const $=x=>document.getElementById(x);
function code(v){return String(v??'').trim().replace(/\.0$/,'')}
function load(rows){products.clear();let ok=0,bad=0;rows.forEach(r=>{let c=code(r[3]),n=String(r[5]??'').trim(),p=typeof r[14]==='number'?r[14]:Number(String(r[14]??'').replace(/[ ,點]/g,''));if(!c||!n||!Number.isFinite(p)||p<0){bad++;return}products.set(c,{barcode:c,name:n,points:p});ok++});$('count').textContent='商品 '+products.size+' 筆';$('imp').textContent='匯入完成：'+ok+' 筆'+(bad?'；略過 '+bad+' 筆（D、F、O 欄資料缺漏或點數錯誤）':'')}
$('file').onchange=async e=>{try{if(!window.XLSX)throw Error('Excel 程式庫載入失敗，請確認網路');let wb=XLSX.read(await e.target.files[0].arrayBuffer(),{type:'array',raw:true}),rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,defval:'',raw:true});if(rows.length<2)throw Error('找不到商品資料');load(rows.slice(1))}catch(err){$('imp').textContent='匯入失敗：'+err.message}};
let audioContext=null;
function beep(){try{const Ctx=window.AudioContext||window.webkitAudioContext;if(!Ctx)return;audioContext=audioContext||new Ctx();if(audioContext.state==='suspended')audioContext.resume();const osc=audioContext.createOscillator(),gain=audioContext.createGain();osc.type='sine';osc.frequency.value=1000;gain.gain.setValueAtTime(0.0001,audioContext.currentTime);gain.gain.exponentialRampToValueAtTime(0.22,audioContext.currentTime+0.01);gain.gain.exponentialRampToValueAtTime(0.0001,audioContext.currentTime+0.16);osc.connect(gain);gain.connect(audioContext.destination);osc.start();osc.stop(audioContext.currentTime+0.17)}catch(e){}}
function add(c){c=code(c);let p=products.get(c);if(!p){$('scanStatus').textContent=c?'找不到條碼 '+c+'，請確認 Excel D 欄':'請輸入條碼';return}let x=cart.get(c);if(x)x.qty++;else cart.set(c,{...p,qty:1});beep();$('scanStatus').textContent='已計點：'+p.name+'（'+p.points+' 點／件）';$('manual').value='';render()}
function render(){let body=$('rows');body.innerHTML='';let qty=0,points=0;if(!cart.size)body.innerHTML='<tr><td colspan="5" class="empty">尚未掃描商品</td></tr>';for(let [c,x] of cart){qty+=x.qty;points+=x.qty*x.points;let tr=document.createElement('tr'),name=document.createElement('td');name.textContent=x.name;name.append(document.createElement('br'));let sm=document.createElement('small');sm.textContent=c;sm.style.color='#777';name.append(sm);let pt=document.createElement('td');pt.className='num';pt.textContent=x.points+' 點';let q=document.createElement('td');q.className='num';let ctl=document.createElement('div');ctl.className='qty';let m=document.createElement('button');m.className='secondary';m.textContent='−';m.onclick=()=>change(c,-1);let b=document.createElement('b');b.textContent=x.qty;let plus=document.createElement('button');plus.className='secondary';plus.textContent='+';plus.onclick=()=>change(c,1);ctl.append(m,b,plus);q.append(ctl);let sub=document.createElement('td');sub.className='num';sub.textContent=x.qty*x.points+' 點';let del=document.createElement('td'),db=document.createElement('button');db.className='danger';db.textContent='刪除';db.onclick=()=>{cart.delete(c);render()};del.append(db);tr.append(name,pt,q,sub,del);body.append(tr)}$('kinds').textContent=cart.size+' 種';$('qty').textContent=qty+' 件';$('points').textContent=points.toLocaleString()+' 點'}
function change(c,d){let x=cart.get(c);x.qty+=d;if(x.qty<=0)cart.delete(c);render()}
$('add').onclick=()=>add($('manual').value);$('manual').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();add($('manual').value)}};
$('clear').onclick=()=>{if(cart.size&&confirm('確定清空本次計點清單？')){cart.clear();render()}};
$('start').onclick=async()=>{if(!window.Html5Qrcode){$('scanStatus').textContent='掃碼程式載入失敗，請確認網路';return}if(!window.isSecureContext){$('scanStatus').textContent='相機需要 HTTPS 網址，請先部署網頁';return}try{scanner=new Html5Qrcode('reader');await scanner.start({facingMode:'environment'},{fps:10,qrbox:{width:260,height:130},aspectRatio:1.6,formatsToSupport:[Html5QrcodeSupportedFormats.EAN_13,Html5QrcodeSupportedFormats.EAN_8,Html5QrcodeSupportedFormats.UPC_A,Html5QrcodeSupportedFormats.UPC_E,Html5QrcodeSupportedFormats.CODE_128,Html5QrcodeSupportedFormats.CODE_39,Html5QrcodeSupportedFormats.ITF]},v=>{let now=Date.now();if(v!==lastCode||now-lastAt>1600){lastCode=v;lastAt=now;add(v)}},()=>{});scanning=true;$('start').disabled=true;$('stop').disabled=false;$('scanStatus').textContent='相機已開啟，請對準商品條碼'}catch(e){$('scanStatus').textContent='無法開啟相機：'+(e.message||e)+'。請檢查相機權限'}};
$('stop').onclick=async()=>{if(scanner&&scanning){try{await scanner.stop();scanner.clear()}catch(e){}scanning=false;$('start').disabled=false;$('stop').disabled=true;$('scanStatus').textContent='掃描已停止'}};
$('template').onclick=()=>{let a=Array(15).fill('');a[3]='國際條碼';a[5]='品名';a[14]='換購點數';let data=[a];for(let x of [['4710000000012','原味吐司',10],['4710000000029','可頌',5],['4710000000036','酸種麵包',15]]){let r=Array(15).fill('');r[3]=x[0];r[5]=x[1];r[14]=x[2];data.push(r)}let csv=data.map(r=>r.map(v=>'"'+v+'"').join(',')).join('\r\n'),blob=new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'}),link=document.createElement('a');link.href=URL.createObjectURL(blob);link.download='計點商品欄位範例.csv';link.click();URL.revokeObjectURL(link.href)};
$('export').onclick=()=>{if(!cart.size){alert('目前沒有計點資料');return}let rows=[['國際條碼','品名','每件換購點數','數量','點數小計'],...Array.from(cart.values(),x=>[x.barcode,x.name,x.points,x.qty,x.points*x.qty]),['','','','總計',Array.from(cart.values()).reduce((s,x)=>s+x.points*x.qty,0)]],csv=rows.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\r\n'),blob=new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='計點明細_'+new Date().toISOString().slice(0,10)+'.csv';a.click();URL.revokeObjectURL(a.href)};
render();
</script></body></html>
